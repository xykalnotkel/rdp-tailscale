name: RDP via Tailscale (Windows, tanpa API key)

# ============================================================
#  RDP gratis via GitHub Actions (Windows) + Tailscale
#  - Tanpa OAuth / API key / client secret
#  - Cukup klik link login yang muncul di log saat Actions jalan
#  - RDP native Windows (bisa lewat mstsc / aplikasi RDP apa pun)
#
#  + TAMBAHAN: tema ungu (dark) + wallpaper otomatis
# ============================================================

on:
  workflow_dispatch:
    inputs:
      EXIT_NODE:
        description: 'Tailscale exit node (IP 100.x atau nama device) supaya IP keluar = IP kamu (rumah/VPS), bukan datacenter GitHub. Kosongkan kalau gak punya.'
        required: false
        default: ''

concurrency:
  group: rdp-tailscale
  cancel-in-progress: true   # NOTE: kalau kamu trigger lagi saat masih jalan, run yang lama di-cancel

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # 6 jam — batas mutlak runner GitHub-hosted

    steps:
      # ------------------------------------------------------
      # 1. Aktifkan RDP + set password
      # ------------------------------------------------------
      - name: Aktifkan RDP & set password
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          if ($env:RDP_PASSWORD) {
            $pass = $env:RDP_PASSWORD
          } else {
            $pass = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 12 | ForEach-Object {[char]$_})
          }
          "RDP_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText $pass -Force)
          Write-Host "RDP siap. Username: runneradmin"

      # ------------------------------------------------------
      # 2. Install Tailscale
      # ------------------------------------------------------
      - name: Install Tailscale
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\tailscale-setup.exe"
          Start-Process -Wait -FilePath "$env:TEMP\tailscale-setup.exe" -ArgumentList "/quiet"
          Start-Sleep -Seconds 5
          # Di Windows nama service-nya "Tailscale" (bukan "tailscaled" seperti di Linux)
          Get-Service Tailscale | Format-Table Status, Name -AutoSize
          if (-not (Get-Service Tailscale -ErrorAction SilentlyContinue)) {
            Write-Host "Service Tailscale tidak ditemukan. Daftar service terkait:"
            Get-Service | Where-Object { $_.Name -like '*tail*' } | Format-Table Status, Name -AutoSize
            exit 1
          }

      # ------------------------------------------------------
      # 3. Login Tailscale — KLIK LINK YANG MUNCUL DI LOG
      # ------------------------------------------------------
      - name: Login Tailscale (klik link di log)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $hostname = "gh-rdp-" + (-join ((48..57)+(97..122) | Get-Random -Count 4 | ForEach-Object {[char]$_}))

          $job = Start-Job -ScriptBlock {
            param($ts, $hostname)
            # catatan: --ssh TIDAK didukung di Windows, jadi dihilangkan
            & $ts up --hostname=$hostname *>&1 | Out-File -FilePath "C:\ts.log" -Encoding utf8
          } -ArgumentList $ts, $hostname

          # Tunggu link login muncul
          $url = ""
          for ($i=0; $i -lt 120; $i++) {
            if (Test-Path "C:\ts.log") {
              $m = Select-String -Path "C:\ts.log" -Pattern 'https://login\.tailscale\.com/\S+' -AllMatches
              if ($m) { $url = $m.Matches[0].Value; break }
            }
            Start-Sleep -Seconds 1
          }

          if (-not $url) {
            Write-Host "URL tidak ditemukan. Isi log:"
            if (Test-Path "C:\ts.log") { Get-Content "C:\ts.log" }
            exit 1
          }

          Write-Host "======================================================"
          Write-Host "  BUKA & AUTHORIZE LINK INI (login ke akun Tailscale):"
          Write-Host "     $url"
          Write-Host "======================================================"
          Write-Host "::notice title=KLIK LINK LOGIN TAILSCALE::$url"

          # Tunggu sampai terhubung (ada IP 100.x), maks 30 menit
          $ip = ""
          for ($i=0; $i -lt 900; $i++) {
            $ip = (& $ts ip -4 2>$null | Out-String).Trim()
            if ($ip -match '^100\.') { break }
            Start-Sleep -Seconds 2
          }
          if ($ip -match '^100\.') {
            "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
            Write-Host "SUKSES! IP Tailscale: $ip"
          } else {
            Write-Host "Belum terhubung (link belum di-approve). Status Tailscale:"
          }
          & $ts status 2>$null | Out-Host
          # Pastikan step tidak gagal hanya karena exit code tailscale
          exit 0

      # ------------------------------------------------------
      # 4. Tampilkan info koneksi RDP
      # ------------------------------------------------------
      - name: Tampilkan info koneksi RDP
        shell: powershell
        run: |
          Write-Host "======================================================"
          Write-Host "  IP Tailscale : $env:TS_IP"
          Write-Host "  Port RDP     : 3389"
          Write-Host "  Username     : runneradmin"
          Write-Host "  Password     : $env:RDP_PASS"
          Write-Host "======================================================"
          Write-Host "  Cara connect: buka Remote Desktop (mstsc), isi:"
          Write-Host "    ${env:TS_IP}:3389"
          Write-Host "======================================================"
          Write-Host "::notice title=RDP Siap::IP = ${env:TS_IP}:3389 | user = runneradmin"

      # ------------------------------------------------------
      # 5. (OPSIONAL) Exit node + siapkan browser
      #    Biar IP yang dilihat Google = IP rumah/VPS kamu,
      #    bukan IP datacenter GitHub (Azure) yang suka kena flag.
      # ------------------------------------------------------
      - name: Exit node Tailscale + tips login Google (opsional)
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          # Pasang exit node kalau diisi (contoh: 100.x.y.z atau nama device)
          if ($env:EXIT_NODE) {
            Write-Host "Pasang exit node -> $env:EXIT_NODE"
            & $ts set --exit-node=$env:EXIT_NODE 2>&1 | Out-Host
            Start-Sleep -Seconds 5
            & $ts status 2>$null | Out-Host
          } else {
            Write-Host "EXIT_NODE kosong -> traffic browser tetap lewat IP GitHub/Azure."
            Write-Host "Kalau login Google kena 'unusual activity', isi input EXIT_NODE"
            Write-Host "dengan IP perangkat Tailscale kamu (HP/PC rumah) yang aktif exit node."
          }

          # Pastikan Chrome ada (biasanya udah keinstall di runner)
          if (Test-Path "C:\Program Files\Google\Chrome\Application\chrome.exe") {
            Write-Host "Chrome tersedia"
          } else {
            Write-Host "Chrome tidak ditemukan (pakai Edge saja)"
          }

          Write-Host "======================================================"
          Write-Host "  TIPS BIAR LOGIN GOOGLE GA KENA FLAG:"
          Write-Host "  1. Pakai exit node (IP rumah kamu) - PALING PENTING"
          Write-Host "  2. Login lewat browser biasa, JANGAN incognito"
          Write-Host "  3. Aktifkan 2FA / passkey di akun Google-nya"
          Write-Host "  4. Saat muncul 'verify it's you', konfirmasi aja 1x"
          Write-Host "  5. Jangan login-logout berulang dari IP baru"
          Write-Host "======================================================"

      # ------------------------------------------------------
      # 6. TEMA UNGU (dark + aksen) + WALLPAPER
      # ------------------------------------------------------
      - name: Set tema ungu + wallpaper
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # ===== 1) TEMA: dark mode + aksen UNGU (#8B5CF6) =====
          $pers = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $pers -Force | Out-Null
          Set-ItemProperty -Path $pers -Name AppsUseLightTheme    -Value 0 -Type DWord
          Set-ItemProperty -Path $pers -Name SystemUsesLightTheme -Value 0 -Type DWord
          Set-ItemProperty -Path $pers -Name ColorPrevalence      -Value 1 -Type DWord
          Set-ItemProperty -Path $pers -Name EnableTransparency   -Value 0 -Type DWord

          # Aksen ungu #8B5CF6 -> format ABGR 0xAABBGGRR = 0xFFF65C8B
          $dwm = 'HKCU:\Software\Microsoft\Windows\DWM'
          New-Item -Path $dwm -Force | Out-Null
          Set-ItemProperty -Path $dwm -Name AccentColor           -Value 4294335627 -Type DWord  # 0xFFF65C8B
          Set-ItemProperty -Path $dwm -Name ColorizationColor     -Value 3304479883 -Type DWord  # 0xC4F65C8B
          Set-ItemProperty -Path $dwm -Name ColorizationAfterglow -Value 3304479883 -Type DWord
          Write-Host "Tema ungu (dark) aktif"

          # ===== 2) WALLPAPER =====
          $img = "$env:USERPROFILE\wallpaper.jpg"
          $urls = @(
            'https://api-asset.haekal.web.id/a/xyspace-assets%2Fapproved%2FXyCloudStore_rental_pc_morphing_16x9',
            'https://cdn.haekal.web.id/image/upload/f_auto,q_auto:good,dpr_auto/v1788811715/xyspace-assets/approved/XyCloudStore_rental_pc_morphing_16x9.png'
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $img -UseBasicParsing
              if ((Test-Path $img) -and (Get-Item $img).Length -gt 10000) { $ok = $true; break }
            } catch {
              Write-Host "Gagal download $u -> $($_.Exception.Message)"
            }
          }

          if ($ok) {
            $desk = 'HKCU:\Control Panel\Desktop'
            Set-ItemProperty -Path $desk -Name Wallpaper      -Value $img
            Set-ItemProperty -Path $desk -Name WallpaperStyle -Value '10'   # 10 = Fill (isi penuh)
            Set-ItemProperty -Path $desk -Name TileWallpaper  -Value '0'
            RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True
            Write-Host "Wallpaper OK -> $img"
          } else {
            Write-Host "::warning::Wallpaper gagal diunduh, RDP tetap bisa dipakai"
          }

      # ------------------------------------------------------
      # 7. Keep-alive
      # ------------------------------------------------------
      - name: Keep-alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "$(Get-Date -Format u) - masih hidup | IP: $env:TS_IP"
            Start-Sleep -Seconds 300
          }
