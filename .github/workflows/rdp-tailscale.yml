name: RDP via Tailscale (Windows)

# ============================================================================
#  v2 - versi panel
#  - Password acak otomatis tiap run (16 karakter)
#  - PC name bisa diatur (default: Kall)
#  - Login Tailscale OTOMATIS kalau secret TS_AUTHKEY diisi
#    (tanpa TS_AUTHKEY tetap bisa: klik link di log seperti biasa)
#  - Provision penuh di provision.ps1: drivers, admin tertinggi, taskbar
#    transparan, Lightshot, optimasi, wallpaper custom (upload/URL)
#  - Di akhir run, info koneksi (IP + password) dikirim TERENKRIPSI ke
#    runtime/state.json biar web panel bisa baca tanpa buka log Actions.
#    Enkripsi pakai AES-256 (kunci: secret PANEL_KEY)
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      PC_NAME:
        description: 'Nama PC (Windows + Tailscale)'
        required: false
        default: 'Kall'
      EXIT_NODE:
        description: 'Tailscale exit node (IP 100.x atau nama device) supaya IP keluar = IP kamu, bukan datacenter. Kosongkan kalau tidak pakai.'
        required: false
        default: ''
      WALLPAPER_URL:
        description: 'URL wallpaper langsung. Kosongkan = wallpaper default / hasil upload panel.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: rdp-kall
  cancel-in-progress: true

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # 6 jam = batas runner GitHub-hosted

    steps:
      # ------------------------------------------------------------
      # 1. Ambil kode repo (provision.ps1)
      # ------------------------------------------------------------
      - uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Aktifkan RDP + password acak
      # ------------------------------------------------------------
      - name: Aktifkan RDP dan set password acak
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          if ($env:RDP_PASSWORD) {
            $pass = $env:RDP_PASSWORD
            Write-Host 'Menggunakan RDP_PASSWORD dari secret (password tetap).'
          } else {
            $chars = (48..57) + (65..90) + (97..122)   # A-Z a-z 0-9, tanpa karakter ambigu
            $pass = -join ($chars | Get-Random -Count 16 | ForEach-Object { [char]$_ })
            Write-Host 'Password acak baru dibuat (16 karakter).'
          }
          "RDP_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

          Set-LocalUser -Name 'runneradmin' -Password (ConvertTo-SecureString -AsPlainText $pass -Force)
          if (-not (Get-LocalGroupMember -Group 'Administrators' -Member 'runneradmin' -ErrorAction SilentlyContinue)) {
            Add-LocalGroupMember -Group 'Administrators' -Member 'runneradmin'
          }
          Write-Host 'RDP siap. Username: runneradmin'

      # ------------------------------------------------------------
      # 3. Install Tailscale
      # ------------------------------------------------------------
      - name: Install Tailscale
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile "$env:TEMP\tailscale-setup.exe"
          Start-Process -Wait -FilePath "$env:TEMP\tailscale-setup.exe" -ArgumentList '/quiet'
          Start-Sleep -Seconds 5
          if (-not (Get-Service Tailscale -ErrorAction SilentlyContinue)) {
            Get-Service | Where-Object { $_.Name -like '*tail*' } | Format-Table Status, Name -AutoSize
            exit 1
          }
          Write-Host 'Tailscale terinstall'

      # ------------------------------------------------------------
      # 4. Login Tailscale (otomatis via TS_AUTHKEY; fallback klik link)
      # ------------------------------------------------------------
      - name: Login Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $hostname = ('${{ inputs.PC_NAME }}' -replace '[^A-Za-z0-9\-]', '')
          if (-not $hostname) { $hostname = 'Kall' }

          function Wait-IP([int]$MaxTries) {
            for ($i = 0; $i -lt $MaxTries; $i++) {
              $ip = (& $ts ip -4 2>$null | Out-String).Trim()
              if ($ip -match '^100\.') { return $ip }
              Start-Sleep -Seconds 2
            }
            return ''
          }

          $ip = ''

          # --- mode A: auth key (otomatis) ---
          if ($env:TS_AUTHKEY) {
            Write-Host 'TS_AUTHKEY ditemukan - login otomatis (tanpa klik link).'
            & $ts up --authkey $env:TS_AUTHKEY --hostname $hostname *>&1 | Out-Host
            $ip = Wait-IP 150   # tunggu maks 5 menit
            if (-not $ip) {
              Write-Host '::warning::TS_AUTHKEY tidak menghasilkan koneksi (kemungkinan invalid/kedaluwarsa) - fallback ke mode link manual.'
              & $ts logout 2>$null | Out-Null
              Start-Sleep -Seconds 3
            }
          }

          # --- mode B: link login interaktif (dipakai kalau tidak ada authkey / authkey gagal) ---
          if (-not $ip) {
            Write-Host 'Mode interaktif: klik link login yang muncul di bawah (buka sekali per sesi).'
            $job = Start-Job -ScriptBlock {
              param($ts, $hostname)
              & $ts up --hostname=$hostname *>&1 | Out-File -FilePath 'C:\ts.log' -Encoding utf8
            } -ArgumentList $ts, $hostname

            $url = ''
            for ($i = 0; $i -lt 150; $i++) {
              if (Test-Path 'C:\ts.log') {
                $m = Select-String -Path 'C:\ts.log' -Pattern 'https://login\.tailscale\.com/\S+' -AllMatches
                if ($m) { $url = $m.Matches[0].Value; break }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $url) {
              Write-Host 'URL tidak ditemukan. Isi log:'
              if (Test-Path 'C:\ts.log') { Get-Content 'C:\ts.log' }
            } else {
              Write-Host '=========================================================='
              Write-Host ' BUKA DAN AUTHORIZE LINK INI (login ke akun Tailscale):'
              Write-Host "    $url"
              Write-Host '=========================================================='
              Write-Host "::notice title=KLIK LINK LOGIN TAILSCALE::$url"
            }
            $ip = Wait-IP 900   # tunggu approve maks 30 menit
          }

          if ($ip -match '^100\.') {
            "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
            Write-Host "SUKSES! IP Tailscale: $ip"
          } else {
            Write-Host 'Belum terhubung (auth key invalid / link belum di-approve).'
            & $ts status 2>$null | Out-Host
          }
          exit 0

      # ------------------------------------------------------------
      # 5. Exit node (opsional, biar IP internet = IP rumah kamu)
      # ------------------------------------------------------------
      - name: Set exit node (opsional)
        shell: powershell
        env:
          EXIT_NODE: ${{ inputs.EXIT_NODE }}
        run: |
          if ($env:EXIT_NODE) {
            Write-Host "Pasang exit node -> $env:EXIT_NODE"
            & 'C:\Program Files\Tailscale\tailscale.exe' set --exit-node=$env:EXIT_NODE 2>&1 | Out-Host
            Start-Sleep -Seconds 5
          } else {
            Write-Host 'EXIT_NODE kosong - traffic internet tetap lewat IP datacenter. Login Google bisa minta verifikasi tambahan.'
          }

      # ------------------------------------------------------------
      # 6. Provision lengkap: PC name, wallpaper, tema, taskbar
      #    transparan, Lightshot, driver & runtime, admin tertinggi,
      #    optimasi, security longgar, sesi Google (opsional)
      # ------------------------------------------------------------
      - name: Provision lengkap (provision.ps1)
        shell: powershell
        env:
          PC_NAME: ${{ inputs.PC_NAME }}
          WALLPAPER_URL: ${{ inputs.WALLPAPER_URL }}
          WALLPAPER_DEFAULT: 'https://api-asset.haekal.web.id/a/xyspace-assets%2Fapproved%2FXyCloudStore_rental_pc_morphing_16x9'
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:GITHUB_WORKSPACE\provision.ps1"

      # ------------------------------------------------------------
      # 7. Kirim info koneksi (terenkripsi) ke runtime/state.json
      #    supaya web panel tahu IP + password tanpa buka log Actions.
      #    Enkripsi: AES-256-CBC, kunci dari secret PANEL_KEY.
      # ------------------------------------------------------------
      - name: Laporkan status ke panel (terenkripsi)
        shell: powershell
        env:
          PANEL_KEY: ${{ secrets.PANEL_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:PANEL_KEY) {
            Write-Host '::warning::Secret PANEL_KEY belum diset - panel tidak bisa baca info koneksi otomatis. Cek log Actions untuk IP/password.'
            exit 0
          }
          if (-not $env:TS_IP) {
            Write-Host '::warning::Tailscale belum dapat IP - state tidak dikirim. Cek log Actions.'
            exit 0
          }

          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $dns = ''
          try {
            $dns = ((& $ts status --json | ConvertFrom-Json).Self.DNSName).TrimEnd('.')
          } catch {}

          $payload = [ordered]@{
            v             = 1
            ip            = $env:TS_IP
            dns           = $dns
            user          = 'runneradmin'
            pass          = $env:RDP_PASS
            machine       = '${{ inputs.PC_NAME }}'
            provisionedAt = (Get-Date).ToUniversalTime().ToString('o')
            expiresAt     = (Get-Date).ToUniversalTime().AddMinutes(330).ToString('o')  # 5,5 jam aman di bawah limit 6 jam
          } | ConvertTo-Json -Compress

          # hex -> byte[] (PS 5.1 tidak punya FromHexString)
          $hex = $env:PANEL_KEY
          if ($hex.Length % 2 -ne 0) { throw 'PANEL_KEY harus hex genap' }
          $key = New-Object byte[] ($hex.Length / 2)
          for ($i = 0; $i -lt $key.Length; $i++) {
            $key[$i] = [Convert]::ToByte($hex.Substring($i * 2, 2), 16)
          }

          $aes = [System.Security.Cryptography.Aes]::Create()
          $aes.Key = $key
          $aes.Mode = [System.Security.Cryptography.CipherMode]::CBC
          $aes.Padding = [System.Security.Cryptography.PaddingMode]::PKCS7
          $aes.GenerateIV()
          $enc = $aes.CreateEncryptor()
          $plain = [System.Text.Encoding]::UTF8.GetBytes($payload)
          $cipher = $enc.TransformFinalBlock($plain, 0, $plain.Length)
          $blob = 'v1.' + [Convert]::ToBase64String($aes.IV) + '.' + [Convert]::ToBase64String($cipher)

          $repo = $env:GITHUB_REPOSITORY
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'rdp-kall'; Accept = 'application/vnd.github+json' }
          $path = 'runtime/state.json'

          $sha = $null
          try {
            $cur = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/contents/$path" -Headers $headers -Method Get
            $sha = $cur.sha
          } catch {}

          $put = @{ message = 'update state run (encrypted)'; content = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($blob)) }
          if ($sha) { $put.sha = $sha }
          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/contents/$path" -Headers $headers -Method Put -Body ($put | ConvertTo-Json -Compress) | Out-Null
            Write-Host 'Status terenkripsi terkirim ke runtime/state.json'
          } catch {
            Write-Host "::warning::Gagal kirim state: $($_.Exception.Message)"
          }

      # ------------------------------------------------------------
      # 8. Keep-alive (biar VM tetap hidup sampai 6 jam / di-cancel panel)
      # ------------------------------------------------------------
      - name: Keep-alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "$(Get-Date -Format u) - hidup | IP: $env:TS_IP"
            Start-Sleep -Seconds 300
          }
